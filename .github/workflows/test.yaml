name: test
on: [push, workflow_dispatch]
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install iverilog
        shell: bash
        run: sudo apt-get update && sudo apt-get install -y iverilog

      # Set Python up and install cocotb
      - name: Setup python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Python packages
        shell: bash
        run: |
          python -m pip install --upgrade pip
          # install into the user's site-packages; console scripts will be in $HOME/.local/bin
          python -m pip install -r test/requirements.txt
          # ensure pip-installed console scripts are on PATH for the following make step
          echo "Adding $HOME/.local/bin to PATH"
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Debug: show python and paths
        shell: bash
        run: |
          which python || true
          python --version || true
          echo "PATH=$PATH"
          ls -la $HOME/.local/bin || true

      - name: Run tests
        shell: bash
        run: |
          cd test
          make clean || true
          set -o pipefail
          if ! make 2>&1 | tee make.log; then
            echo "make failed; printing make.log"
            sed -n '1,200p' make.log || true
            # If make fails, attempt to show whether cocotb-config is available
            if ! command -v cocotb-config >/dev/null 2>&1; then
              echo "ERROR: cocotb-config not found on PATH. Ensure cocotb is installed and $HOME/.local/bin is on PATH."
            fi
            exit 1
          fi

          # Must have results.xml — fail if it doesn't exist
          if [ ! -f results.xml ]; then
            echo "ERROR: results.xml not found after running tests"
            ls -la
            exit 1
          fi

          # Fail if any test failures are recorded in the junit results.xml
          if grep -i "<failure" results.xml >/dev/null 2>&1; then
            echo "TESTS FAILED (found <failure> in results.xml)"
            # Print a compact summary for logs
            grep -n "<failure" -n results.xml || true
            exit 1
          fi

      - name: Test Summary
        uses: test-summary/action@v2.4
        with:
          paths: "test/results.xml"
        if: always()

      - name: upload waveform and test results
        if: success() || failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: |
            test/tb.fst
            test/results.xml
            test/output/*
